
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>CIOBANU Real Estate CRM</title>
<style>
body { font-family: Arial; background: #0f172a; color: white; text-align: center; }
.container { margin-top: 50px; }
button { padding: 10px 20px; margin: 10px; background: #2563eb; color: white; border: none; }
input { padding: 8px; width: 200px; }
</style>
</head>
<body>

<div class="container">
<h1>CIOBANU Real Estate CRM</h1>

<h2>Lead nou</h2>
<input id="nume" placeholder="Nume"><br><br>
<input id="telefon" placeholder="Telefon"><br><br>
<input id="buget" placeholder="Buget"><br><br>

<button onclick="salveaza()">Salvează</button>
<h2>Adaugă proprietate</h2>
<input id="titlu" placeholder="Titlu"><br><br>
<input id="pret" placeholder="Preț"><br><br>
<input id="oras" placeholder="Oraș"><br><br>

<button onclick="adaugaProprietate()">Adaugă</button>

<h2>Proprietăți</h2>
<ul id="listaProp"></ul>
<h2>Lead-uri salvate</h2>
<ul id="lista"></ul>

</div>

<script>
function salveaza() {
    let nume = document.getElementById("nume").value;
    let telefon = document.getElementById("telefon").value;
    let buget = document.getElementById("buget").value;

    let lead = { nume, telefon, buget };

    let leaduri = JSON.parse(localStorage.getItem("leaduri")) || [];
    leaduri.push(lead);

    localStorage.setItem("leaduri", JSON.stringify(leaduri));

    afiseaza();
}

function afiseaza() {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    let leaduri = JSON.parse(localStorage.getItem("leaduri")) || [];

    leaduri.forEach(l => {
        let li = document.createElement("li");

        let text = document.createElement("span");
        text.textContent = l.nume + " - " + l.telefon + " - " + l.buget + " ";

        let btn = document.createElement("button");
        btn.textContent = "WhatsApp";

        let mesaj = "Buna " + l.nume + "! Te contactez de la CIOBANU Real Estate.";

        btn.onclick = function() {
            window.open("https://wa.me/" + l.telefon + "?text=" + encodeURIComponent(mesaj));
        };

        li.appendChild(text);
        li.appendChild(btn);

        lista.appendChild(li);
    });
}

window.onload = afiseaza;
</script>

</body>
</html>
