<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>CIOBANU Real Estate CRM</title>
<style>
body { font-family: Arial; background: #0f172a; color: white; text-align: center; }
.container { margin-top: 50px; }
button { padding: 10px 20px; margin: 10px; background: #2563eb; color: white; border: none; }
input, select { padding: 8px; width: 200px; }
</style>
</head>
<body>

<div class="container">
<h1>CIOBANU Real Estate CRM</h1>

<h2>Lead nou</h2>
<input id="nume" placeholder="Nume"><br><br>
<input id="telefon" placeholder="Telefon"><br><br>
<input id="buget" placeholder="Buget"><br><br>
<button onclick="salveaza()">Salvează</button>

<h2>Adaugă proprietate</h2>
<input id="titlu" placeholder="Titlu"><br><br>
<input id="pret" placeholder="Preț"><br><br>
<input id="oras" placeholder="Oraș"><br><br>
<button onclick="adaugaProprietate()">Adaugă</button>

<h2>Proprietăți</h2>
<ul id="listaProp"></ul>

<h2>Lead-uri salvate</h2>
<ul id="lista"></ul>

<h2>Lead Credit</h2>
<input id="numeCredit" placeholder="Nume"><br><br>
<input id="telefonCredit" placeholder="Telefon"><br><br>
<input id="suma" placeholder="Sumă"><br><br>
<select id="tipCredit">
<option>Credit ipotecar</option>
<option>Nevoi personale</option>
</select><br><br>
<button onclick="adaugaCredit()">Trimite la credit</button>

<h2>Lead-uri Credite</h2>
<ul id="listaCredite"></ul>

</div>

<script>
function salveaza() {
    let nume = document.getElementById("nume").value;
    let telefon = document.getElementById("telefon").value;
    let buget = document.getElementById("buget").value;

    let leaduri = JSON.parse(localStorage.getItem("leaduri")) || [];
    leaduri.push({ nume, telefon, buget });

    localStorage.setItem("leaduri", JSON.stringify(leaduri));
    afiseaza();
}

function afiseaza() {
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    let leaduri = JSON.parse(localStorage.getItem("leaduri")) || [];

    leaduri.forEach(l => {
        let li = document.createElement("li");

        let text = document.createElement("span");
        text.textContent = l.nume + " - " + l.telefon + " - " + l.buget + " ";

        let btn = document.createElement("button");
        btn.textContent = "WhatsApp";

        btn.onclick = function() {
            window.open("https://wa.me/" + l.telefon);
        };

        li.appendChild(text);
        li.appendChild(btn);
        lista.appendChild(li);
    });
}

function adaugaProprietate() {
    let titlu = document.getElementById("titlu").value;
    let pret = document.getElementById("pret").value;
    let oras = document.getElementById("oras").value;

    let proprietati = JSON.parse(localStorage.getItem("proprietati")) || [];
    proprietati.push({ titlu, pret, oras });

    localStorage.setItem("proprietati", JSON.stringify(proprietati));
    afiseazaProp();
}

function afiseazaProp() {
    let lista = document.getElementById("listaProp");
    lista.innerHTML = "";

    let proprietati = JSON.parse(localStorage.getItem("proprietati")) || [];

    proprietati.forEach(p => {
        let li = document.createElement("li");
        li.textContent = p.titlu + " - " + p.pret + "€ - " + p.oras;
        lista.appendChild(li);
    });
}

function adaugaCredit() {
    let nume = document.getElementById("numeCredit").value;
    let telefon = document.getElementById("telefonCredit").value;
    let suma = document.getElementById("suma").value;
    let tip = document.getElementById("tipCredit").value;

    let credite = JSON.parse(localStorage.getItem("credite")) || [];
    credite.push({ nume, telefon, suma, tip });

    localStorage.setItem("credite", JSON.stringify(credite));
    afiseazaCredite();
}

function afiseazaCredite() {
    let lista = document.getElementById("listaCredite");
    lista.innerHTML = "";

    let credite = JSON.parse(localStorage.getItem("credite")) || [];

    credite.forEach(c => {
        let li = document.createElement("li");

        let text = document.createElement("span");
        text.textContent = c.nume + " - " + c.telefon + " - " + c.suma + "€ - " + c.tip + " ";

        let btn = document.createElement("button");
        btn.textContent = "WhatsApp";

        btn.onclick = function() {
            window.open("https://wa.me/" + c.telefon);
        };

        li.appendChild(text);
        li.appendChild(btn);
        lista.appendChild(li);
    });
}

window.onload = function() {
    afiseaza();
    afiseazaProp();
    afiseazaCredite();
};
</script>

</body>
</html>
